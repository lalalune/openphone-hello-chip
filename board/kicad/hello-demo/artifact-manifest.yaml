manifest: hello_demo_kicad_board_evidence
schema: docs/manufacturing/schemas/artifact-manifest.schema.yaml
status: scaffold
release_gate: board_fabrication_release
policy:
  preflight: Track required board evidence without claiming fabrication readiness.
  release: Require real KiCad sources, clean headless checks, fabrication outputs, and DFM review evidence.
artifact_groups:
  kicad_sources:
    owner: board_closure
    status: missing
    artifacts:
      - name: project
        status: missing
        required_metadata:
          - source_revision
          - package_manifest_checksum
        globs:
          - board/kicad/hello-demo/*.kicad_pro
      - name: schematic
        status: missing
        required_metadata:
          - source_revision
          - package_pinout_checksum
        globs:
          - board/kicad/hello-demo/*.kicad_sch
      - name: pcb
        status: missing
        required_metadata:
          - source_revision
          - schematic_checksum
          - footprint_source_checksum
        globs:
          - board/kicad/hello-demo/*.kicad_pcb
      - name: vendor_derived_footprint
        status: missing
        checksum_manifest: docs/manufacturing/evidence/package/footprint-source.sha256
        required_metadata:
          - package_drawing_revision
          - package_drawing_checksum
          - footprint_review_owner
        globs:
          - board/kicad/hello-demo/**/*.pretty/*.kicad_mod
  kicad_cli_outputs:
    owner: board_closure
    status: missing
    cli_commands:
      erc: kicad-cli sch erc --exit-code-violations --output board/kicad/hello-demo/reports/erc.txt board/kicad/hello-demo/<project>.kicad_sch
      drc: kicad-cli pcb drc --exit-code-violations --output board/kicad/hello-demo/reports/drc.txt board/kicad/hello-demo/<project>.kicad_pcb
      gerbers: kicad-cli pcb export gerbers --output board/kicad/hello-demo/fab/gerbers board/kicad/hello-demo/<project>.kicad_pcb
      drill: kicad-cli pcb export drill --output board/kicad/hello-demo/fab/drill board/kicad/hello-demo/<project>.kicad_pcb
      bom: kicad-cli sch export python-bom --output board/kicad/hello-demo/fab/bom/hello-demo.xml board/kicad/hello-demo/<project>.kicad_sch
      position: kicad-cli pcb export pos --output board/kicad/hello-demo/fab/position/hello-demo.pos board/kicad/hello-demo/<project>.kicad_pcb
    artifacts:
      - name: erc_report
        status: missing
        required_metadata:
          - kicad_version
          - command
          - schematic_checksum
        clean_regex: "(?i)(0\\s+errors?|erc\\s+(clean|pass(?:ed)?))"
        fail_regex: "(?i)(error|fail|violations?\\s*[:=]\\s*[1-9][0-9]*)"
        globs:
          - board/kicad/hello-demo/reports/erc*.txt
      - name: drc_report
        status: missing
        required_metadata:
          - kicad_version
          - command
          - pcb_checksum
        clean_regex: "(?i)(0\\s+(drc\\s+)?violations?|drc\\s+(clean|pass(?:ed)?))"
        fail_regex: "(?i)(error|fail|violations?\\s*[:=]\\s*[1-9][0-9]*)"
        globs:
          - board/kicad/hello-demo/reports/drc*.txt
      - name: gerbers
        status: missing
        required_metadata:
          - kicad_version
          - command
          - pcb_checksum
        globs:
          - board/kicad/hello-demo/fab/gerbers/*.gbr
      - name: drill
        status: missing
        required_metadata:
          - kicad_version
          - command
          - pcb_checksum
        globs:
          - board/kicad/hello-demo/fab/drill/*.drl
      - name: bom
        status: missing
        required_metadata:
          - kicad_version
          - command
          - schematic_checksum
        globs:
          - board/kicad/hello-demo/fab/bom/*.csv
          - board/kicad/hello-demo/fab/bom/*.xml
      - name: pick_and_place
        status: missing
        required_metadata:
          - kicad_version
          - command
          - pcb_checksum
        globs:
          - board/kicad/hello-demo/fab/position/*.pos
          - board/kicad/hello-demo/fab/position/*.csv
  board_reviews:
    owner: board_closure
    status: missing
    artifacts:
      - name: assembly_dfm_review
        status: missing
        required_metadata:
          - reviewer
          - date
          - pcb_revision
          - disposition
        globs:
          - docs/manufacturing/evidence/board/*dfm*
          - board/reports/fab/*dfm*
      - name: stackup_return_path_review
        status: missing
        required_metadata:
          - reviewer
          - date
          - stackup_revision
          - disposition
        globs:
          - board/reports/si/*stackup*
          - docs/manufacturing/evidence/board/*stackup*
      - name: package_board_net_cross_probe
        status: missing
        checksum_manifest: docs/manufacturing/evidence/board/package-board-net-cross-probe.sha256
        required_metadata:
          - package_pinout_checksum
          - kicad_schematic_checksum
          - kicad_pcb_checksum
          - reviewer
          - disposition
        globs:
          - docs/manufacturing/evidence/board/*cross-probe*
          - board/reports/fab/*cross-probe*
  si_pi_current_blockers:
    owner: si_pi_closure
    status: missing
    artifacts:
      - name: board_signal_integrity_report
        status: missing
        required_metadata:
          - board_revision
          - stackup_revision
          - source_checksum
          - disposition
        globs:
          - board/reports/si/**/*si*
          - docs/manufacturing/evidence/board/**/*si*
      - name: board_power_integrity_report
        status: missing
        required_metadata:
          - board_revision
          - rail_model_revision
          - source_checksum
          - disposition
        globs:
          - board/reports/pi/**/*pi*
          - docs/manufacturing/evidence/board/**/*pi*
      - name: first_article_current_limits
        status: missing
        required_metadata:
          - board_revision
          - rail_limit_revision
          - source_checksum
          - disposition
        globs:
          - docs/manufacturing/evidence/current/**/*
          - board/reports/fab/*current*
