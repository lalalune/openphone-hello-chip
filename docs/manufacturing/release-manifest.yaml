release: openphone_hello_demo
status: pipeline_scaffold
real_world_gap_manifest: docs/manufacturing/real-world-verification-gaps.yaml
blocked_gates:
  pd_release:
    blocked: true
    evidence_manifest: pd/signoff/manifest.yaml
    reason: Routed PD closure artifacts are not archived.
    unblock_requires:
      - Pass scripts/check_pd_signoff.py against one complete routed run.
      - Archive selected PDK, corner, tool-version, report, and waiver evidence.
  tapeout_release:
    blocked: true
    evidence_manifest: pd/signoff/manifest.yaml
    reason: Package, padframe, SI/PI, and PDN/current-budget evidence is incomplete.
    unblock_requires:
      - Replace placeholder package and padframe plans with vendor/foundry artifacts.
      - Close SI/PI and PDN/current-budget readiness sections in pd/signoff/manifest.yaml.
  board_fabrication_release:
    blocked: true
    evidence_manifest: docs/manufacturing/release-manifest.yaml
    reason: Board fabrication package, KiCad, DFM, SI/PI, and first-article evidence is missing.
    unblock_requires:
      - Release a KiCad schematic/PCB package from vendor footprint data.
      - Archive ERC, DRC, Gerber, drill, BOM, position, DFM, current-limit, and first-article evidence.
readiness:
  si_pi:
    status: blocked
    evidence_manifest: pd/signoff/manifest.yaml
  pdn_current_budget:
    status: blocked
    evidence_manifest: pd/signoff/manifest.yaml
  padframe_package:
    status: blocked
    evidence_manifest: pd/signoff/manifest.yaml
required_artifacts:
  rtl:
    - rtl/top/hello_chip_top.sv
    - rtl/debug/hello_dbg_mmio_bridge.sv
    - rtl/clock/hello_reset_sync.sv
    - rtl/top/hello_soc_top.sv
    - rtl/bootrom/hello_bootrom.sv
    - rtl/peripherals/hello_peripherals.sv
    - rtl/dma/hello_dma.sv
    - rtl/npu/hello_npu.sv
    - rtl/display/hello_display.sv
  verification:
    - verify/cocotb/test_hello_chip.py
    - verify/formal/hello_dbg_mmio_bridge.sby
    - verify/formal/hello_dbg_mmio_bridge_formal.sv
    - verify/formal/hello_soc_top.sby
    - verify/formal/hello_soc_top_formal.sv
    - verify/formal/hello_dma.sby
    - verify/formal/hello_dma_formal.sv
    - verify/formal/hello_npu.sby
    - verify/formal/hello_npu_formal.sv
  product:
    - package/hello-demo-pinout.yaml
    - package/hello-demo-package.md
    - package/hello-demo-pad-ring.md
    - package/wifi-external-interface.yaml
    - pd/pin_order.cfg
    - pd/constraints/hello_soc.sdc
    - pd/constraints/hello_soc_gf180.sdc
    - pd/padframe/hello_demo_padframe.md
    - pd/padframe/hello_demo_padframe.yaml
    - pd/signoff/manifest.yaml
    - board/README.md
    - board/fpga/README.md
    - board/fpga/hello_demo_fpga.yaml
    - board/fpga/constraints/hello_demo_ulx3s.lpf
    - board/kicad/hello-demo/fab-notes.md
    - fw/board-smoke/tests/smoke_plan.md
    - docs/manufacturing/hello-demo-checklist.md
    - docs/manufacturing/real-world-verification-gaps.yaml
  generated:
    - build/netlist/hello_chip_synth.v
    - build/reports/hello_soc_yosys.log
    - build/reports/tool_versions.txt
    - verify/cocotb/results.xml
known_waivers:
  - The MVP is a padless digital macro/top wrapper, not a foundry padframe-inclusive standalone chip.
  - OpenLane/OpenROAD signoff artifacts are required before any tapeout claim.
  - The NPU, DMA, and display blocks are behavioral contract stubs, not production IP.
