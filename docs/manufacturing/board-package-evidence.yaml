evidence_manifest: board_package_vendor_fab_evidence
status: release_blocked
owner: product_physical_closure
release_gate: board_fabrication_release
policy:
  preflight: Verify placeholder board/package blockers are explicit and no missing vendor or KiCad artifact is claimed complete.
  release: Require real package-vendor, KiCad source, fab export, cross-probe, DFM, SI/PI, and current-limit evidence.
placeholder_blockers:
  - id: placeholder_package_pinout
    file: package/hello-demo-pinout.yaml
    required_text:
      - qfn64_placeholder
      - Non-release placeholder package
  - id: draft_package_contract
    file: docs/package/hello-demo-package.md
    required_text:
      - not a foundry-approved package
      - actual shuttle/package/bonding evidence
  - id: kicad_placeholder_notes
    file: docs/board/kicad/hello-demo/fab-notes.md
    required_text:
      - Package is placeholder-only
      - Footprint is not derived from a package vendor drawing
      - No SI/PI analysis has been performed
artifact_groups:
  package_vendor:
    owner: package_closure
    status: missing
    artifacts:
      - name: package_vendor_drawing
        release_blocker_id: package_drawing
        release_blocker: Package drawing is missing; no vendor package drawing with revision, source SHA, and pin-1 orientation is archived.
        status: missing
        globs:
          - docs/manufacturing/evidence/package/*drawing*
          - package/vendor/*drawing*
        required_metadata:
          - vendor
          - revision
          - source_sha256
          - pin1_orientation
      - name: land_pattern_or_footprint_source
        release_blocker_id: footprint_source
        release_blocker: Package land-pattern or footprint source is missing; no vendor-derived footprint evidence is archived.
        status: missing
        globs:
          - docs/manufacturing/evidence/package/*land*
          - docs/manufacturing/evidence/package/*footprint*
          - package/vendor/*land*
          - package/vendor/*footprint*
        required_metadata:
          - source_drawing_revision
          - source_sha256
      - name: bond_diagram
        release_blocker_id: bond_diagram
        release_blocker: Bond diagram is missing; package pins are not proven against die pads or padframe pads.
        status: missing
        globs:
          - docs/manufacturing/evidence/package/*bond*
          - package/vendor/*bond*
        required_metadata:
          - vendor
          - revision
          - source_sha256
  kicad_sources:
    owner: board_closure
    status: missing
    artifacts:
      - name: kicad_project
        release_blocker_id: kicad_project
        release_blocker: KiCad project is missing under board/kicad/hello-demo.
        status: missing
        globs:
          - board/kicad/hello-demo/*.kicad_pro
      - name: kicad_schematic
        release_blocker_id: kicad_schematic
        release_blocker: KiCad schematic is missing under board/kicad/hello-demo.
        status: missing
        globs:
          - board/kicad/hello-demo/*.kicad_sch
      - name: kicad_pcb
        release_blocker_id: kicad_pcb
        release_blocker: KiCad PCB is missing under board/kicad/hello-demo.
        status: missing
        globs:
          - board/kicad/hello-demo/*.kicad_pcb
      - name: vendor_derived_footprint
        release_blocker_id: vendor_derived_footprint
        release_blocker: Vendor-derived KiCad footprint is missing; do not fabricate from placeholder package data.
        status: missing
        globs:
          - board/kicad/hello-demo/**/*.pretty/*.kicad_mod
        required_metadata:
          - source_drawing_revision
          - source_sha256
  fab_exports:
    owner: board_closure
    status: missing
    artifacts:
      - name: erc_transcript
        release_blocker_id: erc
        release_blocker: KiCad ERC transcript is missing.
        status: missing
        globs:
          - board/kicad/hello-demo/reports/*erc*.txt
          - board/kicad/hello-demo/reports/*erc*.log
      - name: drc_transcript
        release_blocker_id: drc
        release_blocker: KiCad DRC transcript is missing.
        status: missing
        globs:
          - board/kicad/hello-demo/reports/*drc*.txt
          - board/kicad/hello-demo/reports/*drc*.log
      - name: gerbers
        release_blocker_id: gerbers
        release_blocker: Gerber fabrication outputs are missing.
        status: missing
        globs:
          - board/kicad/hello-demo/fab/gerbers/*.gbr
          - board/kicad/hello-demo/fab/gerbers/*.gbrjob
      - name: drill
        release_blocker_id: drill
        release_blocker: Drill fabrication outputs are missing.
        status: missing
        globs:
          - board/kicad/hello-demo/fab/drill/*.drl
          - board/kicad/hello-demo/fab/drill/*.xln
      - name: bom
        release_blocker_id: bom
        release_blocker: Fabrication BOM export is missing.
        status: missing
        globs:
          - board/kicad/hello-demo/fab/bom/*.csv
          - board/kicad/hello-demo/fab/bom/*.xml
      - name: pick_and_place
        release_blocker_id: pick_and_place
        release_blocker: Pick-and-place/position export is missing.
        status: missing
        globs:
          - board/kicad/hello-demo/fab/position/*.pos
          - board/kicad/hello-demo/fab/position/*.csv
  release_reviews:
    owner: manufacturing_closure
    status: missing
    artifacts:
      - name: package_padframe_board_cross_probe
        release_blocker_id: cross_probe
        release_blocker: Package-padframe-board cross-probe report is missing.
        status: missing
        globs:
          - docs/manufacturing/evidence/package/*cross-probe*
          - docs/manufacturing/evidence/board/*cross-probe*
        required_metadata:
          - package_pinout_sha256
          - board_revision
          - reviewer
      - name: assembly_dfm_review
        release_blocker_id: dfm
        release_blocker: Assembly DFM review is missing.
        status: missing
        globs:
          - docs/manufacturing/evidence/board/*dfm*
          - board/reports/fab/*dfm*
      - name: board_si_pi_review
        release_blocker_id: si_pi
        release_blocker: Board SI/PI review is missing.
        status: missing
        globs:
          - board/reports/si/**/*
          - board/reports/pi/**/*
          - docs/manufacturing/evidence/board/*si*
          - docs/manufacturing/evidence/board/*pi*
      - name: first_article_current_limits
        release_blocker_id: first_article
        release_blocker: First-article current-limit and stop-condition evidence is missing.
        status: missing
        globs:
          - docs/manufacturing/evidence/current/**/*
          - board/reports/fab/*current*
