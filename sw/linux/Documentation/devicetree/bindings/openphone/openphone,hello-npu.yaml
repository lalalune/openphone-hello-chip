%YAML 1.2
---
$id: http://devicetree.org/schemas/openphone/openphone,hello-npu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OpenPhone hello NPU

maintainers:
  - OpenPhone hello BSP <bsp@openphone.invalid>

description: |
  4 KiB MMIO NPU block defined by sw/platform/hello_platform_contract.json
  (HELLO_NPU_BASE). The kernel driver creates /dev/hello-npu with read/ioctl/
  mmap and registers OP_A/OP_B/OPCODE/RESULT/PERF counters per the contract.

properties:
  compatible:
    const: openphone,hello-npu

  reg:
    maxItems: 1
    description: 4 KiB MMIO window at HELLO_NPU_BASE.

  interrupts:
    maxItems: 1
    description: IRQ_NPU completion line (optional - polled fallback supported).

  interrupt-names:
    items:
      - const: IRQ_NPU

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    npu@10020000 {
        compatible = "openphone,hello-npu";
        reg = <0x10020000 0x1000>;
        interrupt-names = "IRQ_NPU";
    };
