%YAML 1.2
---
$id: http://devicetree.org/schemas/openphone/openphone,hello-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OpenPhone hello GPIO

maintainers:
  - OpenPhone hello BSP <bsp@openphone.invalid>

description: |
  32-bit GPIO_OUT register at HELLO_PERIPHERAL_CONTROL_BASE +
  HELLO_PERIPH_GPIO_OUT_OFFSET, wrapped as a 32-line gpiochip via gpio-mmio.

properties:
  compatible:
    const: openphone,hello-gpio

  reg:
    maxItems: 1
    description: 4 KiB peripheral-control window covering GPIO_OUT.

  gpio-controller: true

  "#gpio-cells":
    const: 2

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    gpio@10000000 {
        compatible = "openphone,hello-gpio";
        reg = <0x10000000 0x1000>;
        gpio-controller;
        #gpio-cells = <2>;
    };
