%YAML 1.2
---
$id: http://devicetree.org/schemas/openagent/openagent,e1-display.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OpenAgent e1 display (simple-framebuffer compatible)

maintainers:
  - OpenAgent e1 BSP <bsp@openagent.invalid>

description: |
  4 KiB MMIO display scan-out block at E1_DISPLAY_BASE per
  sw/platform/e1_platform_contract.json. The driver programs FB_BASE /
  MODE / FORMAT / ENABLE from DT and expects a sibling "simple-framebuffer"
  node for /dev/fb0.

properties:
  compatible:
    const: openagent,e1-display

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: IRQ_VSYNC

  openagent,mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Packed MODE register value (height<<16 | width).

  openagent,format:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Pixel format four-cc as a u32 (default "XR24" = 0x34325258).

  openagent,fb-base:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Physical base address of the framebuffer in DRAM.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    display@10030000 {
        compatible = "openagent,e1-display";
        reg = <0x10030000 0x1000>;
        interrupt-names = "IRQ_VSYNC";
        openagent,mode = <0x01E00280>;
        openagent,format = <0x34325258>;
        openagent,fb-base = <0x80000000>;
    };
