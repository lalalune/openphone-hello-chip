%YAML 1.2
---
$id: http://devicetree.org/schemas/openphone/openphone,hello-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OpenPhone hello DMA

maintainers:
  - OpenPhone hello BSP <bsp@openphone.invalid>

description: |
  4 KiB MMIO DMA contract block at HELLO_DMA_BASE per
  sw/platform/hello_platform_contract.json. The driver exports a sysfs
  contract string and live counters; it is not a dma-engine provider.

properties:
  compatible:
    const: openphone,hello-dma

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  interrupt-names:
    items:
      - const: IRQ_DMA

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    dma@10010000 {
        compatible = "openphone,hello-dma";
        reg = <0x10010000 0x1000>;
        interrupt-names = "IRQ_DMA";
    };
