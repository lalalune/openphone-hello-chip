name: e1-chip

on:
  push:
  pull_request:

jobs:
  docker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tool image
        run: docker build -t openagent-soc-tools .
      - name: Run full lint and type checks
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make lint typecheck
      - name: Run e1-chip regression
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make clean ci-fast
      - name: Run evidence boundary regression
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make evidence-regression-test
      - name: Check generated pipeline artifacts
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make tool-versions && docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools python3 scripts/pipeline_check.py
      - name: Record release-gate tool manifest
        if: always()
        continue-on-error: true
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make record-tool-versions
      - name: Emit mvp-status JSON
        if: always()
        continue-on-error: true
        run: docker run --rm -v "$PWD:/work" -w /work openagent-soc-tools make mvp-status-json
      - name: Show release evidence gate command
        run: |
          echo "Release evidence gate is separate from scaffold CI: make ci-release-evidence"
      - name: Upload regression artifacts
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: e1-chip-regression
          path: |
            build/reports
            build/netlist
            verify/cocotb/results.xml
            verify/cocotb/results/*.xml
            build/reports/cocotb
            build/reports/formal_manifest.json
            verify/formal/*/status
            verify/formal/*/logfile.txt
